# Paths to model weights.

gaze_model:
  # Managed by uniface (Phase 1), not stored under /models -- it downloads
  # RetinaFace + MobileGaze into its own cache on first use (see
  # vision/face_gaze.py and /vision's README). Nothing to point to here.
  architecture: "full_face_cnn"  # iTracker / full-face-CNN lineage (pretrained, not trained from scratch)
  managed_by: "uniface"

character_lm:
  path: "models/char_lm.json"
  architecture: "ngram"  # order-4 interpolated character n-gram (decoder/char_lm.py, Phase 4)
  trained_by: "decoder/train_char_lm.py"
