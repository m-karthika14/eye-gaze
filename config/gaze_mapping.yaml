# Placeholder, calibration-free heuristic for mapping raw gaze angle
# (pitch/yaw from vision/face_gaze.py) to a normalized on-screen point [0,1].
#
# This is NOT a calibrated model. Phase 3 replaces this with a calibrated
# Gaussian probability mapping over keyboard keys; Phase 7 adds continuous
# per-user bias correction on top of the one-time startup auto-center below.
#
# half_fov_* below have been derived from real data by
# experiments/calibrate_uncertainty.py's analyze_range() -- not hand-guessed
# -- computed from this person's actual gaze angle at known target keys.
# vision/gaze_to_screen.py still auto-expands further from live use if a
# bigger swing is ever observed than this.

half_fov_yaw_rad: 0.13    # measured directly from raw yaw output: ~10-12deg real swing (was 0.2968,
                          # which caused the "stuck in the middle" undershoot on the horizontal axis)
half_fov_pitch_rad: 0.1362 # measured directly from raw pitch output: real swing is asymmetric
                          # (up ~14deg, down ~7deg) -- set below the smaller (down) side so it
                          # doesn't undershoot; auto-expansion grows it toward 14deg on an upward glance
invert_x: true            # confirmed inverted via raw pitch/yaw readout (vision/run_demo.py): looking
                          # left produced MORE POSITIVE yaw, looking right produced MORE NEGATIVE yaw --
                          # backwards from the documented convention, specific to this setup
invert_y: false           # raw pitch readout confirmed this is NOT inverted (up -> more positive pitch,
                          # down -> more negative, matches the documented convention) -- the earlier
                          # invert_y:true here was based on a live-app symptom that turned out to have a
                          # different cause; this raw measurement overrides it
startup_bias_frames: 20  # frames averaged at startup to auto-center the model's resting pitch/yaw bias
                          # (every appearance-based gaze model has one -- without this the mapped
                          # point can sit clamped at one screen edge regardless of real eye movement)
max_range_rad: 0.9       # sanity cap on auto-expanded range, so a single noisy outlier can't blow it up

# Phase 7 slice, pulled forward: the one-time startup lock above only
# corrects bias at t=0 -- on longer sessions, head/posture drift partway
# through silently invalidates it (confirmed on real calibration data: raw
# per-key readings crept monotonically across repeats within one multi-minute
# session). These keep the bias continuously chasing a slow moving average
# of the raw signal after the initial lock, so drift self-corrects instead
# of accumulating.
drift_correction_enabled: true
drift_tau_s: 30.0        # time constant of the chase -- long enough that no single key's dwell (<2s) moves it
drift_max_alpha: 0.2     # per-update cap, so one long pause/gap can't snap the bias to a single sample

# One Euro Filter (Casiez et al. 2012) -- replaces flat EMA smoothing. Adapts
# its own smoothing to how fast the signal is moving: heavy smoothing while
# fixating (low jitter, so dwell doesn't flicker between neighboring keys),
# fast response while saccading (low lag, so dwell selection lands on the
# real target instead of one it passed through on the way). If it still feels
# laggy on fast glances, raise filter_beta; if the dot is jittery while
# holding still, lower filter_min_cutoff.
filter_min_cutoff: 1.0
filter_beta: 3.0
filter_d_cutoff: 1.0
