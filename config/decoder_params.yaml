# Decoder/gaze parameters. gaze_uncertainty values below are empirically
# calibrated (see experiments/calibrate_uncertainty.py) -- not guessed.
# Real values are set empirically in Phase 3 (uncertainty calibration) and
# Phase 10 (hyperparameter sweeps on the NVIDIA AI Factory).

fixation:
  # Temporal window used to aggregate raw 30fps gaze samples into one
  # selection-event distribution (Section 8, Stage 2/4).
  min_window_ms: 200
  max_window_ms: 800
  fixation_radius: 0.18

gaze_uncertainty:
  # sigma_x/sigma_y come from vision/fixation.py's per-fixation temporal
  # scatter (empirical, not a fixed global guess). min_sigma floors it so a
  # near-perfectly-still fixation with very few samples doesn't collapse the
  # distribution to one key with false certainty.
  min_sigma: 0.01
  # Multiplicative correction applied to the raw temporal-scatter sigma:
  # calibrated_sigma = raw_sigma * sigma_scale. Computed by
  # experiments/calibrate_uncertainty.py's analyze() (median-based, robust
  # to outlier trials) against real look-at-known-key data. This value is
  # large -- webcam appearance-based gaze estimation genuinely is this
  # imprecise, especially at extreme angles -- not a bug; see /vision's
  # README and the commit history for what was investigated and fixed
  # along the way (a warm-up-window artifact, and a mapping range that had
  # gotten stuck too wide -- both real bugs, now fixed).
  sigma_scale: 3.3194
  calibrated: true  # true once calibrate_uncertainty.py has been run against real data
  # Live S4 decoder (decoder/s4_live.py) per-dwell sigma bounds, in normalized
  # screen units (0.10 = one key width): sigma = clip(dwell_scatter * sigma_scale,
  # floor, ceiling). The floor is the real webcam imprecision (~1 key); the ceiling
  # stops a large sigma_scale flattening the gaze term so far that the language
  # prior alone picks the word. Re-tune after re-running Calibrate.
  live_sigma_floor: 0.08
  live_sigma_ceiling: 0.12

decoder:
  # Joint noisy-channel decoder (S4): P(T|G) ~ P(G|T) * P(T)
  beam_width: 8
  # Relative weighting between gaze likelihood and language prior during
  # beam search; 1.0 = unweighted noisy-channel product. Tuned in Phase 5/10.
  lm_weight: 1.0

fallback:
  # Below this max key probability, do not force a selection (Phase 8).
  min_confidence_threshold: 0.30
